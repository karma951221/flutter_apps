name: pawlog
description: Dog walk log app.
publish_to: none
resolution: workspace

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  core: any
  design_system: any
  l10n: any
  location: any
  permission: any
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  flutter_bloc: ^9.1.1
  flutter_map: ^8.3.2
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^17.5.0
  injectable: ^3.0.0
  intl: ^0.20.2
  latlong2: ^0.10.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  share_plus: ^13.3.1
  path: ^1.9.1
  archive: ^4.5.2
  file_picker: ^13.1.0
  supabase_flutter: ^2.17.2
  flutter_secure_storage: ^11.0.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  injectable_generator: ^3.0.2
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  # 서체는 앱 에셋으로 번들한다 — 로컬 우선 앱이라 첫 실행 오프라인 대비. 라이선스는
  # 같은 폴더의 OFL-*.txt(모두 SIL Open Font License 1.1).
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
    - family: GowunDodum
      fonts:
        - asset: assets/fonts/GowunDodum-Regular.ttf
    - family: Gaegu
      fonts:
        - asset: assets/fonts/Gaegu-Regular.ttf
