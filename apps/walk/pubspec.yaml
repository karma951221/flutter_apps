name: walk
description: Personal step counter and wake-up alarm app.
publish_to: none
resolution: workspace

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  core: any
  design_system: any
  l10n: any
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  health: ^13.3.2
  injectable: ^3.0.0
  intl: ^0.20.2
  permission: any
  # 포크(5.14.0). 바꾼 점은 third_party/alarm/FORK.md
  alarm:
    path: third_party/alarm
  shared_preferences: ^2.5.5
  permission_handler: ^12.0.3
  package_info_plus: ^10.2.1

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  injectable_generator: ^3.0.2
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/alarm/
