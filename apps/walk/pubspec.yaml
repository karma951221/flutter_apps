name: walk
description: Personal step counter and wake-up alarm app.
publish_to: none
resolution: workspace

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  core: any
  design_system: any
  l10n: any
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  health: ^13.3.2
  http: ^1.2.0
  injectable: ^3.0.0
  intl: ^0.20.2
  permission: any
  location: any
  # 포크(5.14.0). 바꾼 점은 third_party/alarm/FORK.md
  alarm:
    path: third_party/alarm
  shared_preferences: ^2.5.5
  permission_handler: ^12.0.3
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  video_compress: ^3.1.4
  video_player: ^2.11.1
  geocoding: ^5.0.0
  local_auth: ^3.0.2
  crypto: ^3.0.7
  uuid: ^4.5.1

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  fake_async: ^1.3.3
  flutter_image_compress_common: ^1.1.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  injectable_generator: ^3.0.2
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/alarm/
